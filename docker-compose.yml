version: '3.8'
services:
  mongodb:
    image: mongo:6.0
    container_name: tekverse-db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: tekverse
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    networks:
      - tekverse-network

  redis:
    image: redis:7-alpine
    container_name: tekverse-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - tekverse-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tekverse-backend
    ports:
      - "5000:5000"
    environment:
      MONGO_URI: mongodb://admin:password123@mongodb:27017/tekverse
      NODE_ENV: development
      JWT_SECRET: tu_jwt_secret_aqui
      CLIENT_URL: http://localhost:3000
    depends_on:
      - mongodb
      - redis
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - tekverse-network

volumes:
  mongodb_data:
  redis_data:

networks:
  tekverse-network:
    driver: bridge